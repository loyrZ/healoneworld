<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to Your Classes</title>
    <link rel="stylesheet" href="SignInStyle.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/header.css">
    <script src="/js/header.js" defer></script>
    <script src="SignInPage.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main class="sign-in-page" id="main-content" tabindex="-1">
    <section class="sign-in-card">
      <h1>Welcome back</h1>
      <p class="intro">
        Enter the email address you used to register for your classes.
      </p>
      <form class="sign-in-form" id="sign-in-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit">View My Classes</button>
      </form>
    </section>
  </main>
</body>
</html>
