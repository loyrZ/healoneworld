<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <link rel="stylesheet" href="SignInStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SignInPage.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="HeadAndSection.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6FEg3ejvKVdNfKIp-BFm15QTqBICuOySCxWEmfTiOnO0cDEFpwB5KsTZs&s=10" alt="Heal One World logo">
    </a>

    <nav>
      <ul>
        <li><a href="#">Classes</a></li>
        <li><a href="#">Programs</a></li>
        <li><a href="#">Volunteer</a></li>
        <li><a href="#">Rent Our Space</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Sign In</a></li>
        <li><a href="#">Donate</a></li>
      </ul>
    </nav>
  </header>

  <main class="sign-in-page">
    <section class="sign-in-card">
      <h1>Welcome back</h1>

      <p class="intro">
        Sign in to manage your classes and account.
      </p>

      <form class="sign-in-form" id="sign-in-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <p id="form-error" class="form-error" role="alert"></p>

        <button type="submit">Sign In</button>

        <div class="account-links">
          <a href="#">Create account</a>
          <a href="#">Forgot password?</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
