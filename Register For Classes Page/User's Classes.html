<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User's Classes</title>
        <link rel="stylesheet" href="User's Classes Style.css">
        <link rel="stylesheet" href="/css/theme.css">
        <link rel="stylesheet" href="/css/layout.css">
        <link rel="stylesheet" href="/css/components.css">
        <link rel="stylesheet" href="/css/header.css">
        <script src="/js/header.js" defer></script>
    </head>
    <body>
        <div data-site-header></div>
        <main id="main-content" tabindex="-1">
            <section class="classes-section">
                <h1>My classes</h1>
                <p class="intro">View and manage your upcoming registrations.</p>

                <div class="class-filters">
                    <button>Recent classes</button>
                    <button>Past classes</button>
                    <button>Upcoming classes</button>
                    <button>Deleted classes</button>
                 </div>
            </section>
            <section class="account-section">
                <h2>Manage your account</h2>
                <p>Cancel an upcoming registration if your plans change, or sign out when you’re finished.</p>
                <small>A confirmation step appears before a registration is removed.</small>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="EmailNotification.js"></script>
        <script src="/js/class-schedule.js"></script>
        <script src="User's Classes.js"></script>
        <script src="User's Classes Buttons.js" defer></script>
    </body>
</html>
