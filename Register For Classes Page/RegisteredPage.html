<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for a Class</title>
    <link rel="stylesheet" href="RegisteredPageStyle.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/header.css">
    <script src="/js/header.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <section class="confirmation" id="main-content" tabindex="-1">
    <div class="confirmation-icon"></div>
    <h3 class="eyebrow">REGISTRATION CONFIRMED</h3>
    <h1 class="title">You're registered.</h1>
    <h2 class="subtitle" id="registered-class"></h2>
    <p class="description">Your registration has been saved.</p>
    <p class="description" id="email-notification-status" role="status" aria-live="polite"></p>
  </section>
  <buttons>
    <button type="button" class="my-classes">My Classes</button>
    <button type="button" class="browse-classes">Browse Classes</button>
  </buttons>
  <script>
    const classSummary = document.querySelector("#registered-class");
    const emailStatus = document.querySelector("#email-notification-status");
    const params = new URLSearchParams(window.location.search);
    const registrationId = Number(params.get("registration"));
    const emailStatusValue = params.get("emailStatus");

    async function loadConfirmation() {
      try {
        const response = await fetch("/api/class-registrations/mine", { headers: { Accept: "application/json" } });
        const registrations = await response.json().catch(() => []);
        const registration = registrations.find((item) => item.id === registrationId);
        const registeredClass = registration && registration.class;
        if (!response.ok || !registeredClass) throw new Error("Registration not found.");

        const classDate = new Date(`${registeredClass.date}T00:00:00`);
        const formattedDate = classDate.toLocaleDateString("en-US", {
          weekday: "long", month: "long", day: "numeric"
        });
        const formattedTime = `${registeredClass.startTime}–${registeredClass.endTime}`;
        const location = registeredClass.location || "Online";
        classSummary.textContent = `${registeredClass.title} • ${formattedDate} • ${formattedTime} ${location} • ${registeredClass.format}`;
      } catch (error) {
        classSummary.textContent = "Class information could not be found.";
      }

      if (emailStatusValue === "sent") {
        emailStatus.textContent = "A confirmation email was sent.";
      } else if (emailStatusValue === "failed") {
        emailStatus.textContent = "Your registration was saved, but we couldn't send the confirmation email. Please contact us if you need help.";
      }
    }

    loadConfirmation();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="EmailNotification.js"></script>
  <script src="RegisteredPageButtons.js" defer></script>
</body>
</html>
