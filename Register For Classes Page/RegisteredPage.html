  <section class="confirmation">
    <div class="confirmation-icon"></div>
    <h3 class="eyebrow">REGISTRATION CONFIRMED</h3>
    <h1 class="title">You're registered.</h1>
    <h2 class="subtitle" id="registered-class"></h2>
    <p class="description">Your registration has been saved.</p>
  </section>
  <buttons>
    <button type="button" class="my-classes">My Classes</button>
    <button type="button" class="browse-classes">Browse Classes</button>
  </buttons>
  <script src="C:\git\healoneworld\Upcoming Classes Practice\classes.js"></script>
  <script>
    const registration = JSON.parse(localStorage.getItem("latestRegistration") || "null");
    const registeredClass = registration && registration.class
      ? classes.find((classItem) => classItem.id === registration.class.id)
      : null;
    const classSummary = document.querySelector("#registered-class");

    if (registeredClass) {
      const classDate = new Date(`${registeredClass.date}T00:00:00`);
      const formattedDate = classDate.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
      const formattedTime = `${registeredClass.startTime}–${registeredClass.endTime}`;
      const location = registeredClass.location || "Online";

      classSummary.textContent =
        `${registeredClass.name} • ${formattedDate} • ${formattedTime} ${location} • ${registeredClass.mode}`;
    } else {
      classSummary.textContent = "Class information could not be found.";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
  <script src="EmailNotification.js"></script>
  <script src="RegisteredPageButtons.js" defer></script>
  <script src="RegisteredPage.js" defer></script>
  <script src="User's Classes.js" defer></script>
</body>
</html>
