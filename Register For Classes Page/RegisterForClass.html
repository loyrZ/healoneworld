<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for a Class</title>
    <link rel="stylesheet" href="RegisterForClassStyle.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/header.css">
    <script src="/js/header.js" defer></script>
</head>
<body>
  <div data-site-header></div>
    <main class="registration-page" id="main-content" tabindex="-1">
        <section class="registration-content">
            <h3 class="eyebrow">CLASS REGISTRATION</h3>
            <h1 class="title" id="registration-title">Register for a Class</h1>
            <h2 class="subtitle">Confirm your information below. Your registration will be saved using the email address you provide.</h2>
        </section>
        <information>
            <form id="registration-form">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="accessibility">Accessibility or accommodation notes (optional)</label>
                <input type="text" id="accessibility" name="accessibility">

                <p id="form-error" class="form-error"></p>

                <button type="submit">Confirm Registration</button>
            </form>
        </information>
        <aside class="class-card">
            <h2>Your class</h2>
            <h3 id="class-name"></h3>
            <p id="class-date"></p>
            <p id="class-time"></p>
            <p id="class-mode"></p>
            <p id="class-location"></p>
            <p class="free-text">Free</p>
            <a href="SignInPage.html" id="class-link">Already Registered?</a>
        </aside>
    </main>
    <script src="/js/class-schedule.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="EmailNotification.js"></script>
    <script src="RegisterForClass.js"></script>
</body>
</html>
